<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2329;
    --text2: #646a73;
    --border: #e5e6eb;
    --primary: #3370ff;
    --primary-hover: #245bdb;
    --success: #34c759;
    --danger: #f54a45;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --card: #232326;
      --text: #e5e6eb;
      --text2: #8a8f99;
      --border: #3a3a3e;
      --primary: #4e7fff;
      --primary-hover: #6b95ff;
      --success: #30d158;
      --danger: #ff6961;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    font-size: 14px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  select, input[type=text] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: var(--radius);
    outline: none;
  }
  select:focus, input[type=text]:focus { border-color: var(--primary); }
  #kw { flex: 1; min-width: 200px; }
  #outdir { flex: 1; min-width: 200px; }
  .dir-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .dir-row label { font-size:12px; color:var(--text2); white-space:nowrap; }
  button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-top: 12px;
  }
  .item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .item:last-child { border-bottom: none; }
  .cover {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--border);
    flex-shrink: 0;
  }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { color: var(--text2); font-size: 12px; margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .item button { padding: 5px 14px; font-size: 13px; flex-shrink: 0; }
  .status {
    padding: 24px 12px;
    text-align: center;
    color: var(--text2);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .status.err { color: var(--danger); }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    display: none;
    z-index: 99;
    max-width: 80vw;
  }
  .toast.show { display: block; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 4px;
    background: rgba(51,112,255,0.12);
    color: var(--primary);
  }
  .badge.flac { background: rgba(52,199,89,0.15); color: var(--success); }
  .badge.hi { background: rgba(255,149,0,0.15); color: #ff9500; }
  .badge.std { background: rgba(142,142,147,0.15); color: var(--text2); }
</style>
</head>
<body>

<div class="toolbar">
  <select id="source">
    <option value="all">综合搜索</option>
    <option value="netease">网易云</option>
    <option value="qq">QQ音乐</option>
    <option value="kugou">酷狗</option>
    <option value="kuwo">酷我</option>
    <option value="migu">咪咕</option>
    <option value="soda">汽水</option>
    <option value="bilibili">Bilibili</option>
  </select>
  <input type="text" id="kw" placeholder="输入歌名 / 歌手，回车搜索">
  <button id="searchBtn">搜索</button>
</div>

<div class="dir-row">
  <label for="outdir">下载目录</label>
  <input type="text" id="outdir" placeholder="留空则使用宿主默认音乐目录" />
</div>

<div id="status" class="status">输入关键词开始搜索</div>
<div class="result" id="resultBox"></div>

<div class="toast" id="toast"></div>

<script>
const PLUGIN = '/api/plugins/musicdl.downloader/run';
const $ = id => document.getElementById(id);

async function callPlugin(body, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
  let resp;
  try {
    resp = await fetch(PLUGIN, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'Lnh-Music-Tag'
      },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
  } catch (e) {
    clearTimeout(timer);
    throw new Error(e.name === 'AbortError' ? '请求超时，请重试' : ('网络请求失败: ' + e.message));
  }
  clearTimeout(timer);
  let data = null;
  try { data = await resp.json(); } catch (e) { /* 非 JSON */ }
  if (!resp.ok) {
    throw new Error((data && data.error) || ('HTTP ' + resp.status));
  }
  if (data && data.ok === false) {
    throw new Error(data.error || '操作失败');
  }
  return data;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function fmtDur(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function qualityBadge(song) {
  const br = song.bitrate || 0;
  const ext = (song.ext || '').toLowerCase();
  if (ext === 'flac' || br >= 800) return '<span class="badge flac">无损 FLAC</span>';
  if (br >= 320) return '<span class="badge hi">极高品 320k</span>';
  if (br >= 192) return '<span class="badge hi">高品 192k</span>';
  if (br > 0) return '<span class="badge std">标准 ' + br + 'k</span>';
  return '<span class="badge std">标准</span>';
}

const SOURCE_LABEL = {
  netease: '网易云', qq: 'QQ音乐', kugou: '酷狗', kuwo: '酷我',
  migu: '咪咕', qianqian: '千千', soda: '汽水', fivesing: '5sing',
  jamendo: 'Jamendo', joox: 'JOOX', bilibili: 'B站', apple: 'Apple'
};
function sourceLabel(s) { return SOURCE_LABEL[s] || s; }

function setStatus(msg, isErr) {
  const st = $('status');
  st.style.display = 'block';
  st.className = 'status' + (isErr ? ' err' : '');
  st.textContent = msg;
}

async function doSearch() {
  const kw = $('kw').value.trim();
  if (!kw) { setStatus('请输入关键词'); return; }
  $('searchBtn').disabled = true;
  setStatus('搜索中（综合多源）...');
  try {
    const src = $('source').value;
    const body = src === 'all'
      ? { op: 'search_all', keyword: kw }
      : { op: 'search', source: src, keyword: kw };
    const r = await callPlugin(body, 20000);
    const songs = (r.data && r.data.songs) || [];
    if (!songs.length) {
      setStatus('未找到结果');
      $('resultBox').innerHTML = '';
      return;
    }
    $('status').style.display = 'none';
    renderSongs(songs);
  } catch (e) {
    setStatus('错误: ' + e.message, true);
  } finally {
    $('searchBtn').disabled = false;
  }
}

function renderSongs(songs) {
  const box = $('resultBox');
  box.innerHTML = songs.map((s, i) => `
    <div class="item">
      <img class="cover" src="${escapeHtml(s.cover || '')}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div class="name">${escapeHtml((s.artist || '未知') + ' - ' + s.name)}</div>
        <div class="meta">
          <span class="badge">${escapeHtml(sourceLabel(s.source))}</span>
          ${qualityBadge(s)}
          <span>· ${escapeHtml(s.album || '')}</span>
          <span>· ${fmtDur(s.duration)}</span>
        </div>
      </div>
      <button data-i="${i}">下载</button>
    </div>
  `).join('');
  box.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => doDownload(songs[+btn.dataset.i], btn);
  });
}

async function doDownload(song, btn) {
  btn.disabled = true;
  btn.textContent = '下载中...';
  try {
    const r = await callPlugin({
      op: 'download',
      song: song,
      out_dir: $('outdir').value.trim() || undefined,
      with_cover: true,
      with_lyrics: true
    }, 120000);
    btn.textContent = '完成';
    toast('已下载: ' + ((r.data && r.data.filename) || '完成'));
    setTimeout(() => { btn.textContent = '下载'; btn.disabled = false; }, 1500);
  } catch (e) {
    btn.textContent = '失败';
    toast('错误: ' + e.message);
    setTimeout(() => { btn.textContent = '下载'; btn.disabled = false; }, 1500);
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 启动时从宿主设置读取默认音乐目录，填入可编辑输入框（GET，无需 CSRF 头）。
async function autodetectDir() {
  try {
    const r = await fetch('/api/settings', { headers: { 'X-Requested-With': 'Lnh-Music-Tag' } });
    if (!r.ok) return;
    const j = await r.json();
    const dir = j.scanDir || j.music_dir || j.download_dir || '';
    if (dir && !$('outdir').value) $('outdir').value = dir;
  } catch (e) { /* 取不到则留空，由插件使用默认目录 */ }
}

autodetectDir();

$('searchBtn').onclick = doSearch;
$('kw').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
