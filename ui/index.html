<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2329;
    --text2: #646a73;
    --border: #e5e6eb;
    --primary: #3370ff;
    --primary-hover: #245bdb;
    --success: #34c759;
    --danger: #f54a45;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --card: #232326;
      --text: #e5e6eb;
      --text2: #8a8f99;
      --border: #3a3a3e;
      --primary: #4e7fff;
      --primary-hover: #6b95ff;
      --success: #30d158;
      --danger: #ff6961;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    font-size: 14px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  select, input[type=text] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: var(--radius);
    outline: none;
  }
  select:focus, input[type=text]:focus { border-color: var(--primary); }
  #kw { flex: 1; min-width: 200px; }
  #outdir { width: 240px; }
  button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .item:last-child { border-bottom: none; }
  .cover {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--border);
    flex-shrink: 0;
  }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { color: var(--text2); font-size: 12px; margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .item button { padding: 5px 14px; font-size: 13px; flex-shrink: 0; }
  .status {
    padding: 24px 12px;
    text-align: center;
    color: var(--text2);
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    display: none;
    z-index: 99;
    max-width: 80vw;
  }
  .toast.show { display: block; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 4px;
    background: rgba(51,112,255,0.12);
    color: var(--primary);
  }
  .badge.flac { background: rgba(52,199,89,0.15); color: var(--success); }
  .badge.hi { background: rgba(255,149,0,0.15); color: #ff9500; }
  .badge.std { background: rgba(142,142,147,0.15); color: var(--text2); }
  .login-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .login-bar .tip { font-size: 12px; color: var(--text2); }
  .login-status { font-size: 12px; color: var(--success); }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    text-align: center;
    max-width: 340px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal-box h3 { margin-bottom: 12px; font-size: 16px; }
  .modal-box img { width: 220px; height: 220px; border-radius: 8px; background: #fff; display: block; margin: 0 auto 12px; }
  .qr-hint { color: var(--text2); font-size: 13px; min-height: 20px; margin-bottom: 12px; }
  .modal-box button { margin-top: 4px; }
</style>
</head>
<body>

<div class="toolbar">
  <select id="source">
    <option value="all">综合搜索</option>
    <option value="netease">网易云</option>
    <option value="qq">QQ音乐</option>
    <option value="kugou">酷狗</option>
    <option value="kuwo">酷我</option>
    <option value="migu">咪咕</option>
    <option value="soda">汽水</option>
    <option value="bilibili">Bilibili</option>
  </select>
  <input type="text" id="kw" placeholder="输入歌名 / 歌手，回车搜索">
  <button id="searchBtn">搜索</button>
</div>

<div class="login-bar">
  <select id="loginSource">
    <option value="netease">网易云</option>
    <option value="qq">QQ音乐</option>
    <option value="kugou">酷狗</option>
    <option value="bilibili">B站</option>
  </select>
  <button id="loginBtn">扫码登录</button>
  <span id="loginStatus" class="login-status"></span>
  <span class="tip">登录后自动保存 Cookie，可下载无损 / VIP 曲目</span>
</div>

<div id="status" class="status" style="padding:24px 12px;text-align:center;color:var(--text2);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);">输入关键词开始搜索</div>
<div class="result" style="margin-top:12px;"></div>

<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3 id="loginModalTitle">扫码登录</h3>
    <img id="qrImg" alt="二维码">
    <div id="qrHint" class="qr-hint">正在生成二维码...</div>
    <button id="qrCloseBtn">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLUGIN = '/api/plugins/musicdl.downloader/run';
const $ = id => document.getElementById(id);

// Cookie 字段映射：平台 -> 插件配置字段名（与 plugin.json fields 对应）
const COOKIE_FIELD = {
  netease: 'netease_cookie', qq: 'qq_cookie', kugou: 'kugou_cookie',
  kuwo: 'kuwo_cookie', migu: 'migu_cookie', bilibili: 'bilibili_cookie'
};
// 支持扫码登录的平台
const LOGIN_SUPPORTED = ['netease', 'qq', 'kugou', 'bilibili'];

// 读取宿主已保存的本插件配置，组装 cookies map（每次调用前取最新值）
async function pluginCookies() {
  const cookies = {};
  try {
    const r = await fetch('/api/plugins', { headers: { 'X-Requested-With': 'LNH-MusicTag' } });
    if (!r.ok) return cookies;
    const j = await r.json();
    const list = (j.plugins || []).filter(p => p.name === 'musicdl.downloader');
    if (!list.length) return cookies;
    const cfg = list[0].config || {};
    for (const src of Object.keys(COOKIE_FIELD)) {
      const v = cfg[COOKIE_FIELD[src]];
      if (v && v.trim()) cookies[src] = v.trim();
    }
  } catch (e) {}
  return cookies;
}

async function callPlugin(body, timeoutMs) {
  // 登录类操作无需 Cookie；其余操作自动携带已配置的 Cookie
  const op = body.op;
  if (!['login_create', 'login_poll', 'list_sources'].includes(op)) {
    body.cookies = await pluginCookies();
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
  try {
    const resp = await fetch(PLUGIN, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'LNH-MusicTag'
      },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    return resp.json();
  } finally {
    clearTimeout(timer);
  }
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function fmtDur(s) {
  if (!s) return '';
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

// 根据码率判断音质标签
function qualityBadge(song) {
  const br = song.bitrate || 0;
  const ext = (song.ext || '').toLowerCase();
  if (ext === 'flac' || br >= 800) return '<span class="badge flac">无损 FLAC</span>';
  if (br >= 320) return '<span class="badge hi">极高品 320k</span>';
  if (br >= 192) return '<span class="badge hi">高品 192k</span>';
  if (br > 0) return '<span class="badge std">标准 ' + br + 'k</span>';
  return '<span class="badge std">标准</span>';
}

// 来源中文名映射
const SOURCE_LABEL = {
  netease: '网易云', qq: 'QQ音乐', kugou: '酷狗', kuwo: '酷我',
  migu: '咪咕', qianqian: '千千', soda: '汽水', fivesing: '5sing',
  jamendo: 'Jamendo', joox: 'JOOX', bilibili: 'B站', apple: 'Apple'
};
function sourceLabel(s) { return SOURCE_LABEL[s] || s; }

async function doSearch() {
  const kw = $('kw').value.trim();
  if (!kw) return;
  $('searchBtn').disabled = true;
  const st = $('status');
  st.style.display = 'block';
  st.textContent = '搜索中（综合多源）...';
  try {
    const src = $('source').value;
    const body = src === 'all'
      ? { op: 'search_all', keyword: kw }
      : { op: 'search', source: src, keyword: kw };
    const r = await callPlugin(body, 20000);
    if (!r.ok) throw new Error(r.error || '搜索失败');
    st.style.display = 'none';
    renderSongs(r.data.songs || []);
  } catch (e) {
    st.textContent = '错误: ' + e.message;
  } finally {
    $('searchBtn').disabled = false;
  }
}

function renderSongs(songs) {
  const box = document.querySelector('.result');
  if (!songs.length) {
    box.innerHTML = '<div class="status">未找到结果</div>';
    return;
  }
  box.innerHTML = songs.map((s, i) => `
    <div class="item">
      <img class="cover" src="${escapeHtml(s.cover || '')}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div class="name">${escapeHtml((s.artist || '未知') + ' - ' + s.name)}</div>
        <div class="meta">
          <span class="badge">${escapeHtml(sourceLabel(s.source))}</span>
          ${qualityBadge(s)}
          <span>· ${escapeHtml(s.album || '')}</span>
          <span>· ${fmtDur(s.duration)}</span>
        </div>
      </div>
      <button data-i="${i}">下载</button>
    </div>
  `).join('');
  box.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => doDownload(songs[+btn.dataset.i], btn);
  });
}

async function doDownload(song, btn) {
  btn.disabled = true;
  btn.textContent = '下载中...';
  try {
    const r = await callPlugin({
      op: 'download',
      song: song,
      out_dir: downloadDir,
      with_cover: true,
      with_lyrics: true
    }, 120000);
    if (!r.ok) throw new Error(r.error || '下载失败');
    btn.textContent = '完成';
    toast('已下载: ' + r.data.filename);
    setTimeout(() => { btn.textContent = '下载'; btn.disabled = false; }, 1500);
  } catch (e) {
    btn.textContent = '失败';
    toast('错误: ' + e.message);
    setTimeout(() => { btn.textContent = '下载'; btn.disabled = false; }, 1500);
  }
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 下载目录（自动探测，不显示输入框）
let downloadDir = 'downloads';

// 递归在对象里找可能的音乐目录字段
function findMusicDir(obj, depth) {
  if (!obj || typeof obj !== 'object' || depth > 4) return null;
  const keys = ['music_dir','musicDir','music_path','musicPath','download_dir','downloadDir','default_dir','defaultDir','library_dir','libraryDir','music_folder','musicFolder','audio_dir','audioDir'];
  for (const k of keys) {
    if (typeof obj[k] === 'string' && obj[k].trim()) return obj[k].trim();
  }
  for (const k in obj) {
    const v = obj[k];
    if (v && typeof v === 'object') {
      const r = findMusicDir(v, depth+1);
      if (r) return r;
    }
  }
  return null;
}

// 启动时自动探测宿主默认音乐目录
async function autodetectDir() {
  const qs = new URLSearchParams(location.search);
  for (const k of ['dir','music_dir','download_dir','default_dir']) {
    if (qs.get(k)) { downloadDir = qs.get(k); return; }
  }
  const endpoints = ['/api/settings','/api/config','/api/app/settings','/api/options','/api/plugin-config'];
  for (const ep of endpoints) {
    try {
      const r = await fetch(ep, { headers: { 'X-Requested-With': 'LNH-MusicTag' } });
      if (!r.ok) continue;
      const j = await r.json();
      const dir = findMusicDir(j, 0);
      if (dir) { downloadDir = dir; return; }
    } catch (e) {}
  }
}

autodetectDir();

// ============================================================
// 扫码登录（自动获取各平台 Cookie）
// ============================================================

let loginTimer = null;
let loginSource = '';

function setQrHint(msg) { $('qrHint').textContent = msg; }

function closeLogin() {
  clearInterval(loginTimer);
  loginTimer = null;
  $('loginModal').style.display = 'none';
}

function openLogin() {
  loginSource = $('loginSource').value;
  if (!LOGIN_SUPPORTED.includes(loginSource)) {
    toast('该平台暂不支持扫码登录');
    return;
  }
  clearInterval(loginTimer);
  $('loginModalTitle').textContent = '扫码登录 · ' + sourceLabel(loginSource);
  $('qrImg').src = '';
  setQrHint('正在生成二维码...');
  $('loginModal').style.display = 'flex';
  callPlugin({ op: 'login_create', source: loginSource }, 15000).then(async r => {
    if (!r.ok) throw new Error(r.error || '创建二维码失败');
    const d = r.data;
    if (!d.qr_png_base64) throw new Error('插件未返回二维码图片');
    $('qrImg').src = 'data:image/png;base64,' + d.qr_png_base64;
    setQrHint('请用' + sourceLabel(loginSource) + '手机App扫码' + (d.expires_at ? '（5分钟内有效）' : ''));
    startLoginPoll(d.source, d.key);
  }).catch(e => {
    setQrHint('错误: ' + e.message);
  });
}

function startLoginPoll(source, key) {
  loginTimer = setInterval(async () => {
    try {
      const r = await callPlugin({ op: 'login_poll', source, key }, 15000);
      if (!r.ok) throw new Error(r.error || '查询状态失败');
      const d = r.data;
      const st = d.status;
      if (st === 'success') {
        clearInterval(loginTimer);
        loginTimer = null;
        setQrHint('登录成功，正在保存 Cookie...');
        await saveCookie(source, d.cookie);
        setQrHint('登录成功！' + sourceLabel(source) + ' Cookie 已保存，可关闭窗口');
        toast('已自动保存 ' + sourceLabel(source) + ' Cookie');
        refreshLoginStatus();
        setTimeout(closeLogin, 1500);
      } else if (st === 'expired') {
        clearInterval(loginTimer);
        loginTimer = null;
        setQrHint('二维码已过期，请关闭后重新扫码');
      } else if (st === 'scanned') {
        setQrHint('已扫码，请在手机上确认登录');
      } else {
        setQrHint('等待扫码...' + (d.message ? '（' + d.message + '）' : ''));
      }
    } catch (e) {
      clearInterval(loginTimer);
      loginTimer = null;
      setQrHint('轮询失败: ' + e.message);
    }
  }, 2500);
}

// 登录成功后把 Cookie 写入宿主插件配置（POST /api/plugins）
async function saveCookie(source, cookie) {
  if (!cookie) throw new Error('登录成功但未获取到 Cookie');
  const field = COOKIE_FIELD[source];
  if (!field) throw new Error('未知平台: ' + source);
  const body = { 'musicdl.downloader': { config: { [field]: cookie } } };
  const r = await fetch('/api/plugins', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'LNH-MusicTag' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('保存配置失败 HTTP ' + r.status);
}

// 显示已登录平台
async function refreshLoginStatus() {
  try {
    const cookies = await pluginCookies();
    const logged = Object.keys(COOKIE_FIELD).filter(src => cookies[src]);
    $('loginStatus').textContent = logged.length
      ? '已登录: ' + logged.map(s => sourceLabel(s)).join('、')
      : '未登录（无损下载需登录）';
  } catch (e) {}
}

$('loginBtn').onclick = openLogin;
$('qrCloseBtn').onclick = closeLogin;
$('loginModal').addEventListener('click', e => { if (e.target === $('loginModal')) closeLogin(); });
refreshLoginStatus();

$('searchBtn').onclick = doSearch;
$('kw').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
